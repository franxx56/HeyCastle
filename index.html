
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCastle 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="gift-screen">
        <h1>A Little Surprise</h1>
        <p>Someone left something for you...</p>

        <button class="gift-button" onclick="openGift()">
            <span>🎁</span>
            <small>Tap to open</small>
        </button>
    </section>

    <main id="main-content" class="hidden">
        <header>
            <h2>HeyCastle 🌷</h2>
        </header>

        <section class="hero">
            <h1>Hey, Hello! 👋</h1>
            <p>A little corner of happiness, made just for you.</p>
        </section>

        <section class="birthday-video">
            <h2>A Little Birthday Surprise 🎁</h2>
           <video id="birthdayVideo" controls autoplay playsinline preload="auto">
                <source src="hello-birthday.mp4.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>
        </section>

        <section class="gallery">
            <h2>A Little World of Beauty</h2>
            <div class="photos">
                <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600" alt="Flowers">
                <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=600" alt="Sunset">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Romantic moment">
            </div>
        </section>

        <footer>Made with ♡ at HeyCastle</footer>
    </main>

    <div id="welcome-popup" class="hidden">
        <div class="popup-card">
            <button class="close-button" onclick="closePopup()">×</button>

            <img
                src="hey.png"
                alt="HeyCastle character"
                class="hero-image"
            >

            <h1>Hey, Hello! 👋</h1>
            <p>A little surprise just for you.</p>
            <button onclick="closePopup()">Let's Go ♡</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
